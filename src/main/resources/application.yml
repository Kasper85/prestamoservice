server:
  port: ${PORT:8080}

spring:
  application:
    name: prestamoservice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prestacontrol}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET:cHJlc3RhY29udHJvbC1kZXYtc2VjcmV0LWtleS1tdXN0LWJlLTMyLWJ5dGVzLWxvbmc=}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
